<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f2">
  <meta name="description" content="Temukan semua tautan dan akun saya di satu tempat.">
  <title>My Links</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="page-shell">
    <section class="profile" aria-label="Profil">
      <div class="avatar-wrap">
        <img id="avatar" class="avatar" alt="Foto profil" hidden>
        <div id="avatar-fallback" class="avatar-fallback" aria-hidden="true">M</div>
      </div>
      <p class="eyebrow">FIND ME HERE</p>
      <h1 id="name">Nama Kamu</h1>
      <p id="username" class="username">@username</p>
      <p id="description" class="description">Tempat menemukan semua akun dan karya saya.</p>
    </section>

    <section id="links" class="links" aria-label="Daftar tautan">
      <div class="loading-line"></div>
      <div class="loading-line"></div>
      <div class="loading-line"></div>
    </section>

    <footer class="footer">
      <span id="footer-text">Terima kasih sudah mampir.</span>
      <span class="footer-mark">·</span>
      <span>MY LINKS</span>
    </footer>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
